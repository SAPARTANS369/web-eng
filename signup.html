<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaApp - Sign Up</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/flowbite@2.5.2/dist/flowbite.min.js"></script>
</head>

<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center">

        <a href="index.html" class="text-2xl font-bold text-blue-600">
            NovaApp
        </a>

        <div class="flex flex-wrap gap-6 items-center">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>

            <a href="signup.html"
               class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                Sign Up
            </a>

            <a href="signin.html"
               class="border border-blue-600 text-blue-600 px-4 py-2 rounded-lg">
                Sign In
            </a>
        </div>
    </div>
</nav>

<!-- Component 1: Header -->
<section class="bg-blue-600 text-white text-center py-14">
    <h1 class="text-4xl font-bold">Create Your Account</h1>
    <p class="mt-3 text-blue-100">
        Join NovaApp today.
    </p>
</section>

<!-- Component 2: Signup Card -->
<section class="max-w-lg mx-auto px-6 py-12">

    <div class="bg-white rounded-xl shadow p-8">

        <h2 class="text-2xl font-bold mb-6">
            Sign Up
        </h2>

        <form class="space-y-5">

            <!-- Component 3: Name Input -->
            <div>
                <label class="block mb-2 font-medium">
                    Full Name
                </label>

                <input
                    type="text"
                    required
                    minlength="2"
                    placeholder="Your full name"
                    class="w-full p-3 border rounded-lg"
                >
            </div>

            <!-- Component 4: Email Input -->
            <div>
                <label class="block mb-2 font-medium">
                    Email
                </label>

                <input
                    type="email"
                    required
                    placeholder="you@example.com"
                    class="w-full p-3 border rounded-lg"
                >
            </div>

            <!-- Component 5: Password -->
            <div>
                <label class="block mb-2 font-medium">
                    Password
                </label>

                <input
                    type="password"
                    required
                    minlength="8"
                    placeholder="Minimum 8 characters"
                    class="w-full p-3 border rounded-lg"
                >
            </div>

            <!-- Component 6: Country -->
            <div>
                <label class="block mb-2 font-medium">
                    Country
                </label>

                <select
                    required
                    class="w-full p-3 border rounded-lg">

                    <option value="">Select Country</option>
                    <option>Pakistan</option>
                    <option>India</option>
                    <option>United Kingdom</option>
                    <option>United States</option>

                </select>
            </div>

            <!-- Component 7: Checkbox -->
            <div class="flex items-center gap-2">

                <input
                    type="checkbox"
                    required
                    class="w-4 h-4">

                <label class="text-sm">
                    I agree to the terms and conditions.
                </label>

            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">

                Create Account

            </button>

        </form>

        <p class="text-center mt-6 text-gray-600">

            Already have an account?

            <a href="signin.html"
               class="text-blue-600 font-semibold hover:underline">
                Sign in.
            </a>

        </p>

    </div>

</section>

<!-- Footer -->
<footer class="bg-gray-900 text-gray-300">

    <div class="max-w-7xl mx-auto px-6 py-10 text-center">

        <h2 class="text-xl font-bold text-white">
            NovaApp
        </h2>

        <p class="mt-3">
            Simple tools for better productivity.
        </p>

    </div>

    <div class="border-t border-gray-700 text-center py-5">
        © 2026 NovaApp. All rights reserved.
    </div>

</footer>

</body>
</html>

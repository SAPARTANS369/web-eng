<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | Chatbase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-50 text-slate-900 font-sans flex flex-col min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-slate-900 border-b border-slate-800 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-3">
          <span class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md">C</span>
          <span class="font-bold text-xl tracking-tight">Chatbase</span>
        </a>
        <nav class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-300">
          <a href="index.html" class="hover:text-indigo-400">Home</a>
          <a href="about.html" class="hover:text-indigo-400">About</a>
          <a href="contact.html" class="hover:text-indigo-400">Contact</a>
        </nav>
        <div class="flex items-center gap-3">
          <a href="signup.html" class="text-sm font-semibold text-slate-300 hover:text-white px-3 py-2">Sign Up</a>
          <a href="signin.html" class="text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg shadow">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Sign Up Form -->
  <main class="flex-grow flex items-center justify-center py-16">
    <div class="max-w-md w-full mx-auto px-4">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-md">
        <h1 class="text-3xl font-extrabold text-slate-900 text-center mb-2">Create your account</h1>
        <p class="text-slate-500 text-center text-sm mb-6">Start building your AI agent with Chatbase.</p>

        <form action="#" method="POST" class="space-y-4">
          <div>
            <label for="fullname" class="block text-sm font-bold text-slate-700 mb-1">Full name</label>
            <input type="text" id="fullname" name="fullname" required minlength="2" placeholder="Your full name" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3">
          </div>
          <div>
            <label for="email" class="block text-sm font-bold text-slate-700 mb-1">Email address</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3">
          </div>
          <div>
            <label for="password" class="block text-sm font-bold text-slate-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required minlength="8" placeholder="At least 8 characters" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3">
          </div>
          <div>
            <label for="company" class="block text-sm font-bold text-slate-700 mb-1">Company</label>
            <input type="text" id="company" name="company" required minlength="2" placeholder="Company name" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-lg shadow-md transition mt-2">Create Account</button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
          Already have an account? <a href="signin.html" class="text-indigo-600 font-bold hover:underline">Sign in.</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 text-sm border-t border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div class="grid md:grid-cols-3 gap-8 items-center">
        <div>
          <div class="font-bold text-white text-lg mb-1">Chatbase</div>
          <p class="text-slate-400">Build AI agents that know your business.</p>
        </div>
        <div class="flex md:justify-center gap-6 font-medium">
          <a href="index.html" class="hover:text-white">Home</a>
          <a href="about.html" class="hover:text-white">About</a>
          <a href="contact.html" class="hover:text-white">Contact</a>
        </div>
        <div class="md:text-right text-slate-500">
          © 2026 Chatbase. All rights reserved.
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaApp - Sign In</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/flowbite@2.5.2/dist/flowbite.min.js"></script>
</head>

<body class="bg-gray-50">

<!-- Navbar -->
<nav class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center">

        <a href="index.html" class="text-2xl font-bold text-blue-600">
            NovaApp
        </a>

        <div class="flex flex-wrap gap-6 items-center">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>

            <a href="signup.html"
               class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                Sign Up
            </a>

            <a href="signin.html"
               class="border border-blue-600 text-blue-600 px-4 py-2 rounded-lg">
                Sign In
            </a>
        </div>
    </div>
</nav>

<!-- Component 1: Header -->
<section class="bg-blue-600 text-white text-center py-14">

    <h1 class="text-4xl font-bold">
        Welcome Back
    </h1>

    <p class="mt-3 text-blue-100">
        Sign in to continue to NovaApp.
    </p>

</section>

<!-- Component 2: Login Card -->
<section class="max-w-md mx-auto px-6 py-12">

    <div class="bg-white rounded-xl shadow p-8">

        <h2 class="text-2xl font-bold mb-6">
            Sign In
        </h2>

        <form class="space-y-5">

            <!-- Component 3: Email -->
            <div>

                <label
                    for="email"
                    class="block mb-2 font-medium">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="you@example.com"
                    class="w-full p-3 border rounded-lg focus:ring-blue-500">

            </div>

            <!-- Component 4: Password -->
            <div>

                <label
                    for="password"
                    class="block mb-2 font-medium">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    required
                    minlength="8"
                    placeholder="Your password"
                    class="w-full p-3 border rounded-lg">

            </div>

            <!-- Component 5: Remember Me -->
            <div class="flex items-center justify-between">

                <label class="flex items-center gap-2">

                    <input
                        type="checkbox"
                        class="w-4 h-4">

                    <span class="text-sm">
                        Remember me
                    </span>

                </label>

                <a href="#" class="text-sm text-blue-600">
                    Forgot password?
                </a>

            </div>

            <!-- Component 6: Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">

                Sign In

            </button>

        </form>

        <!-- Component 7: Signup Link -->
        <p class="text-center mt-6 text-gray-600">

            Don't have an account?

            <a
                href="signup.html"
                class="text-blue-600 font-semibold hover:underline">

                Sign up.

            </a>

        </p>

    </div>

</section>

<!-- Footer -->
<footer class="bg-gray-900 text-gray-300">

    <div class="max-w-7xl mx-auto px-6 py-10 text-center">

        <h2 class="text-xl font-bold text-white">
            NovaApp
        </h2>

        <p class="mt-3">
            Simple tools for better productivity.
        </p>

    </div>

    <div class="border-t border-gray-700 text-center py-5">
        © 2026 NovaApp. All rights reserved.
    </div>

</footer>

</body>
</html>
